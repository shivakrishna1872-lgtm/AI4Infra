# NGINX reverse-proxy configuration for large LiDAR uploads (requirement 3).
#
# This is the FALLBACK posture for when direct-to-storage upload is not yet
# available on a given deployment. With the resumable chunked uploader
# (docs/UPLOADS.md) every request is only ~8 MiB, so these generous limits
# mostly matter for the legacy single-request endpoints.
#
# Why: default NGINX kills request bodies over 1 MiB (413) and times out
# reading a stalled client after 60s -- which is exactly the
# "connection stalled after 60 seconds" failure on 3.8-5 GB .las/.laz uploads.

server {
    listen 80;
    server_name _;

    # --- Large request bodies -------------------------------------------------
    # 10 G covers the competition's largest MX9 capture plus multipart overhead.
    # Without this NGINX returns 413 before the app ever sees the request.
    client_max_body_size 10G;

    # --- Slow-upload tolerance -------------------------------------------------
    # client_body_timeout is an idle-socket timeout BETWEEN reads, not a total
    # transfer deadline: a 5 GB upload over a slow link just needs each TCP
    # read to arrive within this window. 3600s = never kill a healthy-but-slow
    # transfer; stalled connections are handled by the chunked uploader's
    # per-part retries instead of the proxy.
    client_body_timeout 3600s;

    # --- App-server round trips -------------------------------------------------
    # /complete (multipart finalize + local assembly) and viewer-data exports
    # can legitimately run for minutes.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Buffer the whole body on disk before forwarding? No: stream it through so
    # memory stays flat and the app can ACK progress per chunk.
    proxy_request_buffering off;

    # Keep the app's async job responses intact (202-style job ids).
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Equivalent managed-platform notes (no NGINX in the path):
# - Freebuff preview injects PORT; the app binds 0.0.0.0 and honors it
#   (infra_inventory/server.py::main).
# - Cloudflare free proxying caps a single request body at 100 MiB; the chunked
#   uploader sidesteps this entirely because every part is ~8 MiB.
# - AWS ALB idle timeout defaults to 60s; raise it (or prefer chunked parts,
#   which never hold a connection idle long enough to trip it).
# ---------------------------------------------------------------------------
