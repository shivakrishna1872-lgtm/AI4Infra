[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4infra"
version = "0.2.0"
description = "Offline-first LiDAR infrastructure asset inventory pipeline (AI4Infra)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "AI4Infra" }]
keywords = ["lidar", "las", "point-cloud", "infrastructure", "asset-inventory", "pointcept", "ptv3"]
dependencies = [
  "laspy>=2.5",
  "numpy>=1.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
pointcept = ["torch", "torchvision"]  # Pointcept backend; CUDA build required by upstream

[project.scripts]
infra-inventory = "infra_inventory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["infra_inventory*"]

[tool.ruff]
line-length = 120
target-version = "py39"