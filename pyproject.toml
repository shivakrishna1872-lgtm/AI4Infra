[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-point"
version = "0.3.0"
description = "Offline-first LiDAR infrastructure asset inventory pipeline (Terra Point)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Terra Point" }]
keywords = ["lidar", "las", "point-cloud", "infrastructure", "asset-inventory", "pointcept", "ptv3"]
dependencies = [
  "laspy>=2.5",
  "lazrs>=0.5",
  "numpy>=1.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
s3 = ["boto3>=1.34"]  # optional direct-to-S3 presigned uploads (docs/UPLOADS.md)
mongo = ["pymongo>=4.6"]  # optional MongoDB mirror of the inventory (MONGO_URI)
pointcept = ["torch", "torchvision"]  # Pointcept backend; CUDA build required by upstream

[project.scripts]
infra-inventory = "infra_inventory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["infra_inventory*"]

[tool.ruff]
line-length = 120
target-version = "py39"