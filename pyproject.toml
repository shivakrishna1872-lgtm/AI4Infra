[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4infra"
version = "0.1.0"
description = "Offline-first LiDAR infrastructure asset inventory pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "AI4Infra"}]
dependencies = [
  "laspy>=2.5",
  "numpy>=1.22",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
infra-inventory = "infra_inventory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["infra_inventory*"]
